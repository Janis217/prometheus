<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Valerian</title><link rel="stylesheet" href="mission-flow.css">
</head>
<body>
  <header class="app-header"><a class="brand" href="./"><span class="brand-mark"></span>Valerian</a><span class="header-label">Mission simulator</span></header>
  <main class="flow-shell">
    <section id="home" class="home-view">
      <p class="eyebrow">READY WHEN YOU ARE</p><h1>What would you like to do?</h1>
      <div class="choices">
        <button id="start-mission" class="choice" type="button"><span class="choice-icon">&#9654;</span><strong>Start a mission</strong><span>Set up a task and run it in a room.</span><span class="choice-arrow">&#8594;</span></button>
        <a class="choice" href="rooms.html" target="_blank" rel="noopener" id="create-room"><span class="choice-icon">&#9638;</span><strong>Create simulation room</strong><span>Build and save your room in a new tab.</span><span class="choice-arrow">&#8599;</span></a>
      </div>
    </section>
    <section id="access" class="panel narrow" hidden>
      <button class="back" data-home type="button">&#8592; Home</button><h1>Start a mission</h1>
      <form id="access-form"><label>Access code<input id="access-code" autocomplete="off" required maxlength="100" autofocus></label><button class="primary" type="submit">Continue</button></form>
    </section>
    <p id="flow-status" role="status" aria-live="polite"></p>
  </main>
  <script type="module" src="mission-flow.js"></script>
</body>
</html>
